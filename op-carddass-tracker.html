<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OP Carddass Tracker — Trubbish Bin</title>
<link rel="stylesheet" href="tracker.css">
</head>
<body>

<!-- AUTH SCREEN -->
<div id="authScreen" class="auth-screen">
<img src="https://metaprinter.github.io/trubbish-bin/assets/img/header.jpeg" class="auth-logo" alt="Trubbish Bin">
<div>
<div class="auth-title">OP Carddass Tracker</div>
<div class="auth-sub">Track your Hyper Battle collection (1999–2001). Sign in with Google to sync across devices.</div>
</div>
<button id="signInBtn" class="auth-btn">
<svg viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
Sign in with Google
</button>
<div id="authError" style="color:var(--red);font-size:12px;margin-top:10px;display:none"></div>
</div>

<!-- APP (shown after sign-in) -->
<div id="app" style="display:none">

<header class="site-header">
<a href="https://metaprinter.github.io/trubbish-bin/" class="logo-wrap">
<img src="https://metaprinter.github.io/trubbish-bin/assets/img/header.jpeg" class="logo-img" alt="Trubbish Bin">
<div class="logo-text">
<span class="logo-top">TRUBBISH BIN</span>
<span class="logo-bot">OP <span>CARDDASS</span></span>
</div>
</a>

<div class="search-wrap">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
<input type="text" id="searchInput" placeholder="Search cards…">
</div>

<div class="tabs">
<button class="tab active" data-tab="all">All</button>
<button class="tab" data-tab="owned">Owned</button>
<button class="tab" data-tab="missing">Missing</button>
</div>

<div class="hdr-right">
<span class="sync-label"><span class="sync-dot saved"></span><span id="syncLabel">Synced</span></span>
<div class="stat-badge"><strong id="ownedCount">0</strong> / <span id="totalCount">0</span></div>
<button class="hdr-btn export" id="exportBtn">Export TSV</button>
<button class="hdr-btn" id="importBtn">Import TSV</button>
<button class="hdr-btn sort-inactive" id="sortMissingBtn">Sort by Missing</button>
<button class="hdr-btn danger" id="resetBtn">Reset</button>
<button class="hdr-btn" id="signOutBtn">Sign Out</button>
</div>
</header>

<div class="gaps-panel" id="gapsPanel"></div>
<div class="main" id="main"></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept=".tsv,.txt" style="display:none">

</div>

<script src="https://accounts.google.com/gsi/client"></script>
<script src="sets-data.js"></script>
<script src="tracker.js"></script>
</body>
</html>
