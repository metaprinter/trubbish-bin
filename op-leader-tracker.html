<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OP Leader Tracker — Trubbish Bin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0e12;--surface:#13151c;--surface2:#1a1d27;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.12);
  --text:#eceef4;--muted:#636878;--muted2:#9196a8;
  --red:#E8272B;--blue:#2B7FCC;--gold:#F5C842;
  --red-dim:rgba(232,39,43,0.15);--gold-dim:rgba(245,200,66,0.12);
  --green:#22c55e;
  --radius:10px;--card-w:200px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.logo-wrap{cursor:pointer}
.site-header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;gap:14px;height:58px;position:sticky;top:0;z-index:100}
.logo-wrap{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0}
.logo-img{width:38px;height:38px;border-radius:50%;object-fit:cover}
.logo-text{line-height:1}
.logo-top{font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:2px;color:var(--red);display:block}
.logo-bot{font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:1.5px;color:var(--text);display:block}
.logo-bot span{color:var(--blue)}
.search-wrap{flex:1;max-width:300px;position:relative}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search-wrap input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;padding:7px 12px 7px 32px;outline:none;transition:border-color .15s}
.search-wrap input::placeholder{color:var(--muted)}
.search-wrap input:focus{border-color:var(--red)}
.tabs{display:flex;gap:3px}
.tab{font-size:12px;font-weight:500;padding:5px 13px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.tab:hover{color:var(--text);border-color:var(--border2)}
.tab.active{background:var(--red);border-color:var(--red);color:#fff}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.stat-badge{font-family:'DM Mono',monospace;font-size:12px;background:var(--gold-dim);border:1px solid rgba(245,200,66,0.25);border-radius:20px;padding:4px 12px;white-space:nowrap}
.stat-badge strong{color:var(--gold)}
.hdr-btn{font-size:12px;font-weight:500;padding:6px 13px;border-radius:6px;border:1px solid var(--border2);background:transparent;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;white-space:nowrap}
.hdr-btn:hover{color:var(--text);border-color:var(--text)}
.hdr-btn.export:hover{color:var(--gold);border-color:var(--gold)}
.hdr-btn.danger:hover{color:var(--red);border-color:var(--red)}
/* Auth screen */
.auth-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:20px;text-align:center;padding:40px}
.auth-logo{width:80px;height:80px;border-radius:50%;object-fit:cover;margin-bottom:8px}
.auth-title{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:1px;color:var(--text)}
.auth-sub{font-size:14px;color:var(--muted);max-width:340px;line-height:1.6}
.auth-btn{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:12px 22px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;color:var(--text);transition:all .2s;margin-top:8px}
.auth-btn:hover{border-color:var(--blue);background:rgba(43,127,204,.08)}
.auth-btn svg{width:20px;height:20px;flex-shrink:0}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;margin-right:4px;transition:background .3s}
.sync-dot.syncing{background:var(--gold);animation:pulse 1s infinite;}
.sync-dot.saved{background:var(--green);}
.sync-dot.error{background:var(--red);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.sync-label{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace}
/* Main */
.main{padding:28px 24px 80px;max-width:1440px;margin:0 auto}
.set-group{margin-bottom:44px}
.set-header{display:flex;align-items:center;gap:14px;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid var(--border);position:relative}
.set-header::before{content:'';position:absolute;bottom:-2px;left:0;width:48px;height:2px;background:var(--red);border-radius:1px}
.set-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1px;color:var(--text)}
.set-sub{font-size:11px;color:var(--muted);font-weight:400;letter-spacing:.5px;text-transform:uppercase}
.set-progress{margin-left:auto;display:flex;align-items:center;gap:10px}
.progress-track{width:90px;height:3px;background:var(--surface2);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:#27e899;border-radius:2px;transition:width .4s ease}
.progress-pct{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);white-space:nowrap;min-width:52px;text-align:right}
.card-grid{display:grid;grid-template-columns:repeat(5,var(--card-w));gap:12px}
.card{width:var(--card-w);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:border-color .15s,transform .12s,box-shadow .15s;position:relative}
.card:hover{border-color:var(--border2);transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.card.owned{border-color:rgba(232,39,43,.45);background:rgba(232,39,43,.04);cursor:default}
.card.owned:hover{border-color:var(--red);box-shadow:0 8px 24px rgba(232,39,43,.15);transform:none}
.card-img-wrap{width:100%;aspect-ratio:421/614;background:var(--surface2);overflow:hidden;position:relative}
.card-img-wrap img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .25s}
.card-img-wrap img.loading{opacity:0}
.img-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);text-align:center;padding:10px}
.img-ph-id{font-size:11px;font-weight:500;color:var(--muted2)}
.owned-check{position:absolute;top:7px;right:7px;width:24px;height:24px;border-radius:50%;background:var(--red);border:2px solid var(--bg);display:none;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(232,39,43,.5)}
.card.owned .owned-check{display:flex}
.owned-check svg{width:12px;height:12px;color:#fff}
.color-stripe{height:3px;width:100%;flex-shrink:0}
.card-body{padding:10px 12px 12px}
.card-meta{display:flex;align-items:center;gap:5px;margin-bottom:2px}
.card-id{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);line-height:1}
.set-tag{font-size:10px;font-weight:600;letter-spacing:.3px;padding:1px 5px;border-radius:3px;background:rgba(43,127,204,.15);color:var(--blue);border:1px solid rgba(43,127,204,.25)}
.card-name{font-size:13px;font-weight:600;color:var(--text);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-detail{display:none;border-top:1px solid var(--border);padding-top:8px;margin-top:6px}
.card.owned .card-detail{display:block}
.qty-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.qty-label{font-size:12px;color:var(--muted)}
.qty-ctrl{display:flex;align-items:center;gap:5px}
.qty-btn{width:26px;height:26px;border-radius:5px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;font-family:'DM Sans',sans-serif;transition:background .1s}
.qty-btn:hover{background:var(--border2)}
.qty-val{font-family:'DM Mono',monospace;font-size:15px;font-weight:500;min-width:18px;text-align:center;color:var(--gold)}
.cond-pills{display:flex;flex-wrap:wrap;gap:3px}
.pill{font-size:11px;font-weight:600;padding:3px 8px;border-radius:4px;border:1px solid var(--border);color:var(--muted);cursor:pointer;font-family:'DM Mono',monospace;transition:all .1s}
.pill:hover{border-color:var(--border2);color:var(--text)}
.pill.on{background:var(--red);border-color:var(--red);color:#fff}
.errata-row{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px;padding-top:5px;border-top:1px solid var(--border);align-items:center}
.errata-label{font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:'DM Sans',sans-serif;margin-right:2px;white-space:nowrap}
.pill.errata.on{background:var(--blue);border-color:var(--blue);color:#fff}
.pill.errata:hover{border-color:var(--blue);color:var(--blue)}
.remove-btn{display:flex;align-items:center;gap:4px;margin-top:8px;font-size:10px;font-weight:500;color:var(--muted);cursor:pointer;background:transparent;border:1px solid var(--border);border-radius:4px;padding:3px 7px;font-family:'DM Sans',sans-serif;transition:all .15s;width:100%;justify-content:center}
.remove-btn:hover{color:var(--red);border-color:var(--red);background:var(--red-dim)}
.set-group.excluded .card-grid{filter:grayscale(1);opacity:0.35;pointer-events:none}
.set-group.excluded .card{cursor:default}
.st-toggle{font-size:11px;font-weight:600;padding:3px 10px;border-radius:5px;border:1px solid var(--border2);background:transparent;cursor:pointer;font-family:'DM Mono',monospace;letter-spacing:.5px;transition:all .15s;white-space:nowrap;margin-left:10px}
.st-toggle.excluded{background:var(--red-dim);border-color:var(--red);color:var(--red)}
.st-toggle.included{background:rgba(39,232,153,.12);border-color:#27e899;color:#27e899}
.empty{padding:60px 0;text-align:center;color:var(--muted);font-size:14px}
.toast{position:fixed;bottom:24px;right:24px;background:var(--surface2);border:1px solid var(--gold);border-radius:8px;padding:11px 18px;font-size:13px;color:var(--gold);opacity:0;transform:translateY(8px);transition:all .2s;pointer-events:none;z-index:999}
.toast.show{opacity:1;transform:none}
.set-group.promo .set-header::before{background:linear-gradient(90deg,#E8272B,#2B7FCC,#F5C842,#a855f7);width:72px}
.set-group.promo .set-title{background:linear-gradient(90deg,#E8272B,#F5C842,#2B7FCC);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
/* Gaps panel */
.gaps-panel{padding:10px 24px 0;max-width:1440px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.gap-chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--border2);border-radius:6px;padding:4px 10px;font-size:11px;font-family:'DM Mono',monospace;cursor:pointer;transition:border-color .15s,background .15s;text-decoration:none;color:var(--text)}
.gap-chip:hover{border-color:var(--red);background:var(--red-dim)}
.gap-chip .gap-label{color:var(--muted2)}
.gap-chip .gap-count{color:var(--red);font-weight:600}
.gap-chip.done{border-color:rgba(39,232,153,.3);cursor:default;opacity:0.55}
.gap-chip.done .gap-count{color:#27e899}
.gaps-panel-label{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;flex-shrink:0}
/* Sort active state */
.hdr-btn.sort-active{color:#27e899;border-color:#27e899;background:rgba(39,232,153,.08)}
@media(max-width:1100px){.card-grid{grid-template-columns:repeat(4,var(--card-w))}}@media(max-width:880px){.card-grid{grid-template-columns:repeat(3,var(--card-w))}}@media(max-width:640px){:root{--card-w:150px}.card-grid{grid-template-columns:repeat(2,var(--card-w))}.site-header{padding:0 12px;gap:8px;height:54px}.tabs{display:none}.main{padding:18px 12px 60px}.stat-badge{display:none}}
</style>
</head>
<body>
  <div id="authScreen" class="auth-screen">
  <img class="auth-logo" src="https://metaprinter.github.io/trubbish-bin/assets/img/header.jpeg">
  <h1 class="auth-title">OP Leader Tracker</h1>
  <p class="auth-sub">Manage your One Piece Card Game Leader collection and seamlessly sync adjustments to Google Sheets.</p>
  <button id="authBtn" class="auth-btn">
    <svg viewBox="0 0 24 24">
      <path fill="#eceef4" d="M21.35,11.1H12v2.7h5.38c-0.23,1.28 -0.96,2.37 -2.04,3.1v2.58h3.3c1.93,-1.78 3.04,-4.4 3.04,-7.48c0,-0.61 -0.06,-1.21 -0.16,-1.74z" />
      <path fill="#eceef4" d="M12,21c2.43,0 4.47,-0.8 5.96,-2.18l-3.3,-2.58c-0.92,0.62 -2.1,0.98 -3.54,0.98c-2.34,0 -4.33,-1.58 -5.03,-3.72H2.7v2.66C4.18,18.15 7.84,21 12,21z" />
      <path fill="#eceef4" d="M6.97,13.5c-0.18,-0.54 -0.28,-1.11 -0.28,-1.7c0,-0.59 0.1,-1.16 0.28,-1.7V7.44H2.7C2.08,8.68 1.73,10.08 1.73,11.5c0,1.42 0.35,2.82 0.97,4.06l4.27,-3.06z" />
      <path fill="#eceef4" d="M12,5.74c1.32,0 2.51,0.45 3.44,1.35l2.58,-2.58C16.46,3.09 14.43,2.26 12,2.26c-4.14,0 -7.8,2.85 -9.3,6.18l4.27,3.3c0.7,-2.14 2.69,-3.72 5.03,-3.72z" />
    </svg>
    <span>Sign in with Google</span>
  </button>
</div>

<div id="appFrame" style="display:none;">
  <header class="site-header">
    <a href="#" class="logo-wrap" onclick="resetFilters(event)">
      <img class="logo-img" src="https://metaprinter.github.io/trubbish-bin/assets/img/header.jpeg">
      <div class="logo-text">
        <span class="logo-top">CARD TRACKER</span>
        <span class="logo-bot">TRUBBISH<span>BIN</span></span>
      </div>
    </a>
    
    <div class="search-wrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" id="searchInput" placeholder="Search by name, ID, or color..." autocomplete="off">
    </div>

    <div class="tabs">
      <button class="tab active" onclick="filterType('all', this)">All</button>
      <button class="tab" onclick="filterType('owned', this)">Owned</button>
      <button class="tab" onclick="filterType('missing', this)">Missing</button>
    </div>

    <div class="hdr-right">
      <span class="stat-badge">PROG: <strong id="globalProgress">0/0</strong> (<span id="globalPct">0%</span>)</span>
      <span class="stat-badge">TOTAL QTY: <strong id="globalTotalQty" style="color:#eceef4;">0</strong></span>
      <div class="sync-label"><span id="syncDot" class="sync-dot"></span><span id="syncStatus">Checking authentication...</span></div>
      <button class="hdr-btn sort-active" id="sortBtn" onclick="toggleSortOrder()">SORT: SET ID</button>
      <button class="hdr-btn export" onclick="exportToTSV()">EXPORT TSV</button>
      <button class="hdr-btn export" onclick="triggerImport()">IMPORT TSV</button>
      <input type="file" id="tsvImportInput" accept=".tsv" style="display:none;" onchange="handleImportFile(event)">
      <button id="logoutBtn" class="hdr-btn danger">LOGOUT</button>
    </div>
  </header>

  <div id="gapsPanel" class="gaps-panel"></div>
  <main class="main" id="setsContainer"></main>
</div>

<div id="toast" class="toast"></div>
<script>
// --- CORE CONFIGURATION & CONSTANTS ---
const CONFIG = {
  clientId: '934661811568-dksd8eiv7afrvevs463jbeebmfe99itq.apps.googleusercontent.com',
  scopes: 'https://www.googleapis.com/auth/spreadsheets',
  spreadsheetTitle: 'One Piece Card Game Tracker Data (Do Not Delete)',
  sheetName: 'Leaders'
};

const SET_INFO = {
  "OP-01": "Romance Dawn", "OP-02": "Paramount War", "OP-03": "Pillars of Strength",
  "OP-04": "Kingdoms of Intrigue", "OP-05": "Awakening of the New Era", "OP-06": "Wings of the Captain",
  "EB-01": "Extra Booster Memorial Collection", "OP-07": "500 Years into the Future", "OP-08": "Two Legends",
  "OP-09": "The New Emperor", "OP-10": "A New Element", "PROMO": "Promotional / Special Cards"
};

const COLOR_MAPS = {
  "Red": "#E8272B", "Blue": "#2B7FCC", "Green": "#22c55e", 
  "Purple": "#a855f7", "Black": "#1f2937", "Yellow": "#F5C842"
};

// --- STATE MANAGEMENT ---
let tokenClient = null;
let gapiInited = false;
let gapiAuthToken = null;
let spreadsheetId = null;
let masterMetadata = [];
let userCollection = {};
let currentTypeFilter = 'all';
let currentSortOrder = 'id'; // 'id' or 'missing'
let currentSearchQuery = '';
let syncTimeout = null;

// --- INITIALIZATION ---
function initGapi() {
  gapi.load('client', async () => {
    await gapi.client.init({});
    gapiInited = true;
    checkStoredToken();
  });
}

function initGis() {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CONFIG.clientId,
    scope: CONFIG.scopes,
    callback: handleAuthResponse,
  });
}

async function checkStoredToken() {
  const stored = localStorage.getItem('op_tracker_token');
  if (stored) {
    const parsed = JSON.parse(stored);
    if (parsed.expiresAt > Date.now()) {
      gapiAuthToken = parsed.token;
      gapi.client.setToken({ access_token: gapiAuthToken });
      setSyncStatus('authenticated', 'Signed in');
      document.getElementById('authScreen').style.display = 'none';
      document.getElementById('appFrame').style.display = 'block';
      await loadTrackerData();
      return;
    }
  }
  showAuthScreen();
}

function showAuthScreen() {
  document.getElementById('appFrame').style.display = 'none';
  document.getElementById('authScreen').style.display = 'flex';
}

function handleAuthResponse(resp) {
  if (resp.error) {
    setSyncStatus('error', 'Authentication failed');
    return;
  }
  gapiAuthToken = resp.access_token;
  localStorage.setItem('op_tracker_token', JSON.stringify({
    token: gapiAuthToken,
    expiresAt: Date.now() + (resp.expires_in * 1000)
  }));
  setSyncStatus('authenticated', 'Signed in');
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('appFrame').style.display = 'block';
  loadTrackerData();
}

document.getElementById('authBtn').addEventListener('click', () => {
  if (tokenClient) tokenClient.requestAccessToken({ prompt: 'consent' });
});

document.getElementById('logoutBtn').addEventListener('click', () => {
  localStorage.removeItem('op_tracker_token');
  gapiAuthToken = null;
  spreadsheetId = null;
  userCollection = {};
  showAuthScreen();
});

// --- GOOGLE SHEETS INTERACTION ---
async function loadTrackerData() {
  setSyncStatus('syncing', 'Loading application metadata...');
  try {
    const metaResp = await fetch('https://metaprinter.github.io/trubbish-bin/assets/json/op-leaders.json');
    masterMetadata = await metaResp.json();
    
    setSyncStatus('syncing', 'Connecting to Google Drive...');
    spreadsheetId = localStorage.getItem('op_tracker_sp_id');
    if (!spreadsheetId) {
      spreadsheetId = await findOrCreateSpreadsheet();
      localStorage.setItem('op_tracker_sp_id', spreadsheetId);
    }
    
    await fetchUserCollection();
    buildGapsPanel();
    renderDOM();
    setSyncStatus('saved', 'All changes saved');
  } catch (err) {
    console.error(err);
    setSyncStatus('error', 'Error syncing storage configuration');
  }
}

async function findOrCreateSpreadsheet() {
  const listResp = await gapi.client.request({
    path: 'https://www.googleapis.com/drive/v3/files',
    method: 'GET',
    params: { q: `name='${CONFIG.spreadsheetTitle}' and mimeType='application/vnd.google-apps.spreadsheet' and trashed=false` }
  });
  if (listResp.result.files && listResp.result.files.length > 0) {
    return listResp.result.files[0].id;
  }
  const createResp = await gapi.client.request({
    path: 'https://sheets.googleapis.com/v4/spreadsheets',
    method: 'POST',
    body: { properties: { title: CONFIG.spreadsheetTitle } }
  });
  const spId = createResp.result.spreadsheetId;
  await gapi.client.request({
    path: `https://sheets.googleapis.com/v4/spreadsheets/${spId}/sheets:batchUpdate`,
    method: 'POST',
    body: { requests: [{ addSheet: { properties: { title: CONFIG.sheetName } } }, { deleteSheet: { sheetId: 0 } }] }
  });
  return spId;
}

async function fetchUserCollection() {
  try {
    const resp = await gapi.client.request({
      path: `https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${CONFIG.sheetName}!A:D`,
      method: 'GET'
    });
    const rows = resp.result.values;
    userCollection = {};
    if (rows && rows.length > 1) {
      for (let i = 1; i < rows.length; i++) {
        const [id, qty, conds, errata] = rows[i];
        if (id) {
          userCollection[id] = {
            qty: parseInt(qty) || 1,
            conds: conds ? conds.split(',').map(s => s.trim()) : ['NM'],
            errata: errata ? errata.split(',').map(s => s.trim()) : []
          };
        }
      }
    }
  } catch (e) {
    userCollection = {};
  }
}

function queueCloudSync() {
  setSyncStatus('syncing', 'Drafting internal changes...');
  if (syncTimeout) clearTimeout(syncTimeout);
  syncTimeout = setTimeout(executeCloudSync, 1500);
}

async function executeCloudSync() {
  setSyncStatus('syncing', 'Pushing edits to cloud sheet...');
  try {
    const outputRows = [['Card ID', 'Qty', 'Conditions', 'Errata']];
    Object.keys(userCollection).forEach(id => {
      const entry = userCollection[id];
      outputRows.push([id, entry.qty, entry.conds.join(', '), entry.errata.join(', ')]);
    });
    await gapi.client.request({
      path: `https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${CONFIG.sheetName}!A1?valueInputOption=USER_ENTERED`,
      method: 'PUT',
      body: { values: outputRows }
    });
    await gapi.client.request({
      path: `https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${CONFIG.sheetName}!A${outputRows.length + 1}:D1000`,
      method: 'CLEAR'
    });
    setSyncStatus('saved', 'All adjustments uploaded successfully');
  } catch (err) {
    setSyncStatus('error', 'Error writing to destination storage asset');
  }
}

// --- APP UTILITIES & RENDERING ---
function setSyncStatus(state, label) {
  const dot = document.getElementById('syncDot');
  const txt = document.getElementById('syncStatus');
  dot.className = 'sync-dot ' + state;
  txt.innerText = label;
}

function buildGapsPanel() {
  const container = document.getElementById('gapsPanel');
  container.innerHTML = '<span class="gaps-panel-label">Missing Targets:</span>';
  
  const setCounts = {};
  masterMetadata.forEach(c => { if(!userCollection[c.id]) setCounts[c.set] = (setCounts[c.set] || 0) + 1; });
  
  Object.keys(SET_INFO).forEach(sKey => {
    const missingCount = setCounts[sKey] || 0;
    const chip = document.createElement('a');
    chip.href = '#' + sKey;
    chip.className = 'gap-chip' + (missingCount === 0 ? ' done' : '');
    chip.innerHTML = `<span class="gap-label">${sKey}</span>:<span class="gap-count">${missingCount === 0 ? '✓' : missingCount}</span>`;
    container.appendChild(chip);
  });
}

function renderDOM() {
  const container = document.getElementById('setsContainer');
  container.innerHTML = '';
  
  const query = currentSearchQuery.toLowerCase().trim();
  const excludedSets = JSON.parse(localStorage.getItem('op_tracker_excluded_sets') || '[]');

  // Group cards by structural set identifier
  const groupedCards = {};
  Object.keys(SET_INFO).forEach(s => groupedCards[s] = []);
  
  masterMetadata.forEach(card => {
    const isOwned = !!userCollection[card.id];
    if (currentTypeFilter === 'owned' && !isOwned) return;
    if (currentTypeFilter === 'missing' && isOwned) return;
    
    if (query) {
      const matchName = card.name.toLowerCase().includes(query);
      const matchId = card.id.toLowerCase().includes(query);
      const matchColor = card.color.some(c => c.toLowerCase().includes(query));
      if (!matchName && !matchId && !matchColor) return;
    }
    
    if (groupedCards[card.set]) groupedCards[card.set].push(card);
  });

  let overallTotal = 0;
  let overallOwned = 0;
  let aggregateQty = 0;

  masterMetadata.forEach(c => {
    overallTotal++;
    if (userCollection[c.id]) {
      overallOwned++;
      aggregateQty += userCollection[c.id].qty;
    }
  });

  document.getElementById('globalProgress').innerText = `${overallOwned}/${overallTotal}`;
  document.getElementById('globalPct').innerText = overallTotal ? Math.round((overallOwned / overallTotal) * 100) + '%' : '0%';
  document.getElementById('globalTotalQty').innerText = aggregateQty;

  let flatGroups = [];
  Object.keys(groupedCards).forEach(sKey => {
    const cards = groupedCards[sKey];
    if (cards.length === 0 && !query) return;
    
    const isExcluded = excludedSets.includes(sKey);
    let totalSetCards = masterMetadata.filter(c => c.set === sKey).length;
    let ownedSetCards = masterMetadata.filter(c => c.set === sKey && userCollection[c.id]).length;
    let pct = totalSetCards ? Math.round((ownedSetCards / totalSetCards) * 100) : 0;
    
    flatGroups.push({ sKey, cards, isExcluded, ownedSetCards, totalSetCards, pct });
  });

  if (currentSortOrder === 'missing') {
    flatGroups.sort((a, b) => {
      let aRemaining = a.totalSetCards - a.ownedSetCards;
      let bRemaining = b.totalSetCards - b.ownedSetCards;
      if (aRemaining !== bRemaining) return bRemaining - aRemaining;
      return a.sKey.localeCompare(b.sKey);
    });
  }

  if (flatGroups.length === 0) {
    container.innerHTML = '<div class="empty">No matching ledger records mapped to filter query parameters.</div>';
    return;
  }

  flatGroups.forEach(g => {
    if (currentSortOrder === 'missing') {
      g.cards.sort((a, b) => {
        const aOwned = !!userCollection[a.id];
        const bOwned = !!userCollection[b.id];
        if (aOwned !== bOwned) return aOwned ? 1 : -1;
        return a.id.localeCompare(b.id);
      });
    } else {
      g.cards.sort((a, b) => a.id.localeCompare(b.id));
    }

    const section = document.createElement('section');
    section.id = g.sKey;
    section.className = `set-group ${g.sKey === 'PROMO' ? 'promo' : ''} ${g.isExcluded ? 'excluded' : ''}`;
    
    const header = document.createElement('div');
    header.className = 'set-header';
    header.innerHTML = `
      <div>
        <h2 class="set-title">${g.sKey} — ${SET_INFO[g.sKey] || 'Special Releases'}</h2>
        <span class="set-sub">${g.ownedSetCards} of ${g.totalSetCards} Collected</span>
      </div>
      <button class="st-toggle ${g.isExcluded ? 'excluded' : 'included'}" onclick="toggleSetExclusion('${g.sKey}')">
        ${g.isExcluded ? 'TRACKING OFF' : 'TRACKING ON'}
      </button>
      <div class="set-progress">
        <div class="progress-track"><div class="progress-fill" style="width: ${g.pct}%"></div></div>
        <span class="progress-pct">${g.ownedSetCards}/${g.totalSetCards} (${g.pct}%)</span>
      </div>
    `;
    section.appendChild(header);

    const grid = document.createElement('div');
    grid.className = 'card-grid';

    g.cards.forEach(card => {
      const entry = userCollection[card.id];
      const isOwned = !!entry;
      const cardEl = document.createElement('div');
      cardEl.className = `card ${isOwned ? 'owned' : ''}`;
      
      let stripeHTML = '';
      if (card.color && card.color.length > 0) {
        if (card.color.length === 1) {
          stripeHTML = `<div class="color-stripe" style="background:${COLOR_MAPS[card.color[0]] || '#636878'};"></div>`;
        } else {
          const c1 = COLOR_MAPS[card.color[0]] || '#636878';
          const c2 = COLOR_MAPS[card.color[1]] || '#636878';
          stripeHTML = `<div class="color-stripe" style="background:linear-gradient(90deg, ${c1} 50%, ${c2} 50%);"></div>`;
        }
      }

      cardEl.innerHTML = `
        <div class="card-img-wrap">
          <div class="img-ph">
            <span class="img-ph-id">${card.id}</span>
            <span style="margin-top:4px;">Image Stream Offline</span>
          </div>
          <img src="${card.image}" class="loading" alt="${card.name}" onload="this.className='';" onerror="this.style.display='none';">
          <div class="owned-check">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </div>
        </div>
        ${stripeHTML}
        <div class="card-body">
          <div class="card-meta">
            <span class="card-id">${card.id}</span>
            <span class="set-tag">${card.rarity || 'L'}</span>
          </div>
          <div class="card-name" title="${card.name}">${card.name}</div>
          <div class="card-detail">
            <div class="qty-row">
              <span class="qty-label">Quantity</span>
              <div class="qty-ctrl">
                <button class="qty-btn" onclick="adjustQty('${card.id}', -1, event)">-</button>
                <span class="qty-val">${isOwned ? entry.qty : 0}</span>
                <button class="qty-btn" onclick="adjustQty('${card.id}', 1, event)">+</button>
              </div>
            </div>
            <div class="cond-pills">
              <span class="pill ${isOwned && entry.conds.includes('NM') ? 'on' : ''}" onclick="toggleCondition('${card.id}', 'NM', event)">NM</span>
              <span class="pill ${isOwned && entry.conds.includes('LP') ? 'on' : ''}" onclick="toggleCondition('${card.id}', 'LP', event)">LP</span>
              <span class="pill ${isOwned && entry.conds.includes('MP') ? 'on' : ''}" onclick="toggleCondition('${card.id}', 'MP', event)">MP</span>
            </div>
            <div class="errata-row">
              <span class="errata-label">Tags:</span>
              <span class="pill errata ${isOwned && entry.errata.includes('AA') ? 'on' : ''}" onclick="toggleErrata('${card.id}', 'AA', event)">AA</span>
              <span class="pill errata ${isOwned && entry.errata.includes('SP') ? 'on' : ''}" onclick="toggleErrata('${card.id}', 'SP', event)">SP</span>
              <span class="pill errata ${isOwned && entry.errata.includes('Pre') ? 'on' : ''}" onclick="toggleErrata('${card.id}', 'Pre', event)">Pre</span>
            </div>
            <button class="remove-btn" onclick="removeCard('${card.id}', event)">PURGE OWNERSHIP</button>
          </div>
        </div>
      `;

      if (!isOwned) {
        cardEl.addEventListener('click', () => {
          userCollection[card.id] = { qty: 1, conds: ['NM'], errata: [] };
          queueCloudSync();
          buildGapsPanel();
          renderDOM();
        });
      }

      grid.appendChild(cardEl);
    });

    section.appendChild(grid);
    container.appendChild(section);
  });
}

function adjustQty(id, delta, ev) {
  ev.stopPropagation();
  if (!userCollection[id]) return;
  userCollection[id].qty = Math.max(1, userCollection[id].qty + delta);
  queueCloudSync();
  renderDOM();
}

function toggleCondition(id, cond, ev) {
  ev.stopPropagation();
  if (!userCollection[id]) return;
  let arr = userCollection[id].conds;
  if (arr.includes(cond)) {
    if (arr.length > 1) arr = arr.filter(c => c !== cond);
  } else {
    arr.push(cond);
  }
  userCollection[id].conds = arr;
  queueCloudSync();
  renderDOM();
}

function toggleErrata(id, tag, ev) {
  ev.stopPropagation();
  if (!userCollection[id]) return;
  let arr = userCollection[id].errata;
  if (arr.includes(tag)) {
    arr = arr.filter(t => t !== tag);
  } else {
    arr.push(tag);
  }
  userCollection[id].errata = arr;
  queueCloudSync();
  renderDOM();
}

function removeCard(id, ev) {
  ev.stopPropagation();
  if (!userCollection[id]) return;
  if (confirm(`Remove asset ${id} metrics from local data arrays?`)) {
    delete userCollection[id];
    queueCloudSync();
    buildGapsPanel();
    renderDOM();
  }
}

function toggleSetExclusion(sKey) {
  let list = JSON.parse(localStorage.getItem('op_tracker_excluded_sets') || '[]');
  if (list.includes(sKey)) {
    list = list.filter(k => k !== sKey);
  } else {
    list.push(sKey);
  }
  localStorage.setItem('op_tracker_excluded_sets', JSON.stringify(list));
  renderDOM();
}

function toggleSortOrder() {
  const btn = document.getElementById('sortBtn');
  if (currentSortOrder === 'id') {
    currentSortOrder = 'missing';
    btn.innerText = 'SORT: MISSING';
  } else {
    currentSortOrder = 'id';
    btn.innerText = 'SORT: SET ID';
  }
  renderDOM();
}

function filterType(type, btn) {
  currentTypeFilter = type;
  document.querySelectorAll('.tabs .tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderDOM();
}

function resetFilters(e) {
  e.preventDefault();
  currentTypeFilter = 'all';
  currentSearchQuery = '';
  document.getElementById('searchInput').value = '';
  document.querySelectorAll('.tabs .tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tabs .tab')[0].classList.add('active');
  renderDOM();
}

document.getElementById('searchInput').addEventListener('input', (e) => {
  currentSearchQuery = e.target.value;
  renderDOM();
});

function showToast(msg) {
  const el = document.getElementById('toast');
  el.innerText = msg;
  el.className = 'toast show';
  setTimeout(() => el.className = 'toast', 3000);
}

// --- DATA PORTABILITY SUB-SYSTEMS ---
function exportToTSV() {
  let content = "Card ID\tQty\tConditions\tErrata\n";
  Object.keys(userCollection).forEach(id => {
    const entry = userCollection[id];
    content += `${id}\t${entry.qty}\t${entry.conds.join(',')}\t${entry.errata.join(',')}\n`;
  });
  const blob = new Blob([content], { type: 'text/tab-separated-values;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `op_leader_collection_${new Date().toISOString().slice(0,10)}.tsv`;
  a.click();
  URL.revokeObjectURL(url);
}

function triggerImport() {
  document.getElementById('tsvImportInput').click();
}

function handleImportFile(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const lines = ev.target.result.trim().split('\n');
      const headers = lines[0].split('\t').map(h => h.trim());
      const idIdx = headers.indexOf('Card ID');
      const qtyIdx = headers.indexOf('Qty');
      const condIdx = headers.indexOf('Conditions');
      const errataIdx = headers.indexOf('Errata');
      if (idIdx === -1) { showToast('Invalid TSV — no Card ID column'); return; }
      
      let count = 0;
      const imported = {};
      for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split('\t');
        const id = cols[idIdx] && cols[idIdx].trim();
        if (!id) continue;
        const qty = qtyIdx >= 0 && cols[qtyIdx] ? parseInt(cols[qtyIdx]) || 1 : 1;
        const condsRaw = condIdx >= 0 && cols[condIdx] ? cols[condIdx].trim() : 'NM';
        const conds = condsRaw.split(',').map(c => c.trim()).filter(Boolean);
        const errataRaw = errataIdx >= 0 && cols[errataIdx] ? cols[errataIdx].trim() : '';
        const errata = errataRaw ? errataRaw.split(',').map(v => v.trim()).filter(Boolean) : [];
        imported[id] = { qty, conds: conds.length ? conds : ['NM'], errata };
        count++;
      }
      if (confirm(`Import ${count} cards from TSV? This will REPLACE your current layout state.`)) {
        userCollection = imported;
        executeCloudSync();
        buildGapsPanel();
        renderDOM();
        showToast(`Successfully processed structural records.`);
      }
    } catch (err) {
      showToast('Parsing failure occurred on matching targets.');
    }
  };
  reader.readAsText(file);
  ev.target.value = '';
}
